name: Production smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check public pages
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://desarrollamo.com.ar/ \
            https://desarrollamo.com.ar/servicios \
            https://desarrollamo.com.ar/galeria
          do
            echo "Checking $url"
            body="$(mktemp)"
            code="$(curl --fail-with-body --location --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              --output "$body" --write-out '%{http_code}' "$url")"
            test "$code" = "200"
            grep -qi 'DesarrollAMO' "$body"
          done
