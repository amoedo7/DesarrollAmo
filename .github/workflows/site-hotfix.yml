name: Apply site hotfix

on:
  push:
    branches:
      - main
      - fix/commercial-contact-funnel
    paths:
      - '.github/workflows/site-hotfix.yml'
      - 'tools/apply_site_hotfix.py'
      - 'tools/normalize_public_nav.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Servicios shell and contact funnel
        run: python tools/apply_site_hotfix.py

      - name: Normalize public navigation
        run: python tools/normalize_public_nav.py

      - name: Validate public navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = ('index.html', 'servicios.html', 'galeria.html', 'manifiesto.html', 'inversiones.html')
          for filename in ('servicios.html', 'galeria.html', 'inversiones.html'):
              text = Path(filename).read_text(encoding='utf-8')
              assert text.count('class="amo-menu"') == 1, filename
              for target in expected:
                  assert f'href="{target}"' in text, (filename, target)
          assert Path('manifiesto.html').is_file()
          print('OK: top and mobile navigation use durable public page links')
          PY

      - name: Validate commercial funnel
        run: |
          python - <<'PY'
          from pathlib import Path
          services = Path('servicios.html').read_text(encoding='utf-8')
          assert 'href="/#contacto"' not in services
          assert services.count('https://www.instagram.com/desarrollamoficial') >= 4
          assert 'el cobro se canaliza por CobrAMO' in services
          print('OK: Servicios has an actionable contact path and explicit payment handoff')
          PY

      - name: Validate resilient gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          gallery = Path('galeria.html').read_text(encoding='utf-8')
          assert '/static/site-shell.css' in gallery
          assert '/static/galeria.css' in gallery
          assert '/static/galeria.js' in gallery
          assert 'static/script.js' not in gallery
          assert 'fade-in' not in gallery
          assert gallery.count('class="project-card"') >= 14
          assert 'class="amo-header"' in gallery
          assert 'class="amo-footer"' in gallery
          print('OK: gallery is static-first and independent from global script.js')
          PY

      - name: Commit deterministic hotfix
        run: |
          git config user.name "DesarrollAMO Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add servicios.html galeria.html inversiones.html
          if git diff --cached --quiet; then
            echo "No public page changes needed"
            exit 0
          fi
          git commit -m "fix(nav): keep public top menu consistent"
          git push
